<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>夜行 Night Walk 2026</title>
<style>
  :root{
    --bg:#fbf9f3; --card:#ffffff; --ink:#222; --muted:#6b6b6b;
    --navy:#1f2a44; --gold:#b98a2e; --cream:#faf6ea; --line:#e6dcc0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#10141f; --card:#182033; --ink:#e8e8ec; --muted:#a4a9b8;
      --navy:#0b1020; --gold:#d9ad55; --cream:#1f2842; --line:#33405f;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"PingFang HK","PingFang TC","Noto Sans HK","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:17px; line-height:1.75; -webkit-text-size-adjust:100%;
  }
  header.top{
    background:var(--navy); color:#fff; text-align:center; padding:28px 16px 18px;
    border-bottom:3px solid var(--gold);
  }
  header.top h1{margin:0; font-size:34px; letter-spacing:.35em; padding-left:.35em}
  header.top p{margin:6px 0 0; color:var(--gold); font-size:15px; letter-spacing:.08em}
  nav{
    position:sticky; top:0; z-index:5; display:flex; gap:6px; padding:8px;
    background:var(--navy); justify-content:center; flex-wrap:wrap;
    border-bottom:1px solid var(--gold);
  }
  nav a{
    color:#fff; text-decoration:none; font-size:14px; padding:6px 12px;
    border:1px solid rgba(255,255,255,.35); border-radius:999px; white-space:nowrap;
  }
  nav a:active{background:var(--gold); color:#000}
  main{max-width:680px; margin:0 auto; padding:16px 14px 60px}
  section.stop{
    background:var(--card); border-radius:14px; margin:18px 0 26px; overflow:hidden;
    box-shadow:0 1px 6px rgba(0,0,0,.12); scroll-margin-top:64px;
  }
  .stop-head{background:var(--navy); color:#fff; padding:14px 18px; border-bottom:3px solid var(--gold)}
  .stop-head .cn{font-size:24px; font-weight:700}
  .stop-head .cn small{color:var(--gold); font-size:15px; font-weight:600; margin-right:10px}
  .stop-head .en{font-size:14px; color:var(--gold); letter-spacing:.04em; margin-top:2px}
  .body{padding:6px 18px 18px}
  .ref{color:var(--gold); font-style:italic; font-size:14px; margin:14px 0 4px}
  p{margin:.55em 0}
  .scripture p u, .scripture p .key{font-weight:700; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--gold)}
  .note{color:var(--muted); font-size:14px; margin:.8em 0 0}
  .en-block{
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    font-family:Georgia,"Times New Roman",serif; font-size:16.5px; line-height:1.7; color:var(--ink);
  }
  .lang{font-size:12px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase; margin:0 0 4px}
  .reflect{
    background:var(--cream); border-left:5px solid var(--gold); border-radius:0 8px 8px 0;
    padding:10px 14px; margin-top:18px;
  }
  .reflect .label{color:var(--gold); font-weight:700; margin:0 0 2px}
  .reflect .q{font-weight:700}
  .reflect .en{font-family:Georgia,"Times New Roman",serif; font-size:16px; margin-top:10px; padding-top:8px; border-top:1px dashed var(--line)}
  .song{
    background:var(--card); border-radius:14px; padding:16px 18px; margin:0 0 24px;
    box-shadow:0 1px 6px rgba(0,0,0,.12); border-top:3px solid var(--gold);
  }
  .song h2{margin:0 0 6px; font-size:18px; color:var(--gold)}
  .song .title{font-weight:700; font-size:19px}
  .lyrics{white-space:pre-line; margin-top:10px}
  footer{text-align:center; color:var(--muted); font-size:13px; margin-top:30px}
  .top-link{display:block; text-align:center; margin-top:16px; color:var(--gold); text-decoration:none; font-size:14px}
</style>
</head>
<body>
<header class="top">
  <h1>夜　行</h1>
  <p>Night Walk 2026</p>
</header>
<main>
  <section class="stop"><div class="body" style="text-align:center;padding:28px 18px">
    <p style="font-size:19px"><b>請到各站掃描該站嘅 QR code 閱讀。</b></p>
    <p style="font-family:Georgia,serif">Please scan the QR code at each stop to read.</p>
  </div></section>
</main>
</body>
</html>
